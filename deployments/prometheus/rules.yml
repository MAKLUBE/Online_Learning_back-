groups:
  - name: online_learning_platform
    interval: 15s
    rules:
      #  Service availability
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} (instance={{ $labels.instance }}) has been unreachable for > 30s."

      # gRPC error rate
      - alert: HighGRPCErrorRate
        expr: |
          (
            rate(grpc_errors_total[5m])
            /
            rate(grpc_requests_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%) for service {{ $labels.service }}."

      - alert: CriticalGRPCErrorRate
        expr: |
          (
            rate(grpc_errors_total[5m])
            /
            rate(grpc_requests_total[5m])
          ) > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical gRPC error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 20%) for service {{ $labels.service }}."

      # Request throughput
      - alert: ZeroRequestRate
        expr: rate(grpc_requests_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No traffic on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has received 0 requests in the last 5 minutes."

      # PostgreSQL
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "The PostgreSQL exporter cannot reach the database."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "{{ $value }} active connections (threshold: 80)."

      # Redis
      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "The Redis exporter cannot reach the Redis instance."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis is using {{ $value | humanizePercentage }} of maxmemory."